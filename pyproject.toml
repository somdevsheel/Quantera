# Tool configuration only (dependencies are pinned in requirements*.txt).

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "aws", "boto3", "yf", "pd", "time", "sqlite3"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/versions/**" = ["E501", "W291", "I001"]  # autogenerated

[tool.mypy]
python_version = "3.11"
strict = true
files = ["quantera", "quant", "migrations/env.py"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["argon2.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true
